name: Phase 7 cloud validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter regression and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/features/driver_flow/presentation/providers/canonical_driver_presentation_controller.dart
          test/canonical_driver_presentation_controller_test.dart
      - name: Full serial Flutter suite
        run: flutter test --no-pub --concurrency=1
      - name: Focused Driver presentation regression
        run: flutter test --no-pub --concurrency=1 test/canonical_driver_presentation_controller_test.dart
      - name: Full analyzer (known non-gating baseline diagnostics)
        continue-on-error: true
        run: flutter analyze --no-pub

  deno:
    name: Edge Function tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function unit tests
        working-directory: supabase/functions
        # Only the two synthetic-target identifiers are readable here. The
        # HTTP/Postgres integration test is explicitly skipped unless its
        # isolated test target is supplied by the dedicated local harness.
        run: deno test --node-modules-dir=auto --allow-env=P8_HTTP_CONTAINER,P8_HTTP_DB
      - name: Relevant function and matching type checks
        run: >-
          deno check --no-config --node-modules-dir=auto
          supabase/functions/places/index.ts
          supabase/functions/fare/index.ts
          supabase/functions/cash-matching/index.ts
          supabase/functions/_shared/matching/cash_matching_adapter.ts

  database:
    name: Isolated PostgreSQL, RLS, expiry, Cron and publication guards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Select isolated Supabase DB host port
        # GitHub-hosted runners can have the default Postgres port occupied.
        # Select an ephemeral free port for this disposable workflow checkout;
        # Supabase CLI and its local tests read the same config file afterward.
        run: |
          python - <<'PY'
          import re
          import socket
          from pathlib import Path

          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]

          config = Path("supabase/config.toml")
          source = config.read_text()
          section = re.compile(r"(?ms)(^\[db\]\s*\n)(.*?)(?=^\[|\Z)")
          match = section.search(source)
          if match is None:
              raise SystemExit("[db] section not found")
          body, replacements = re.subn(
              r"(?m)^port\s*=\s*\d+\s*$",
              f"port = {port}",
              match.group(2),
              count=1,
          )
          if replacements != 1:
              raise SystemExit("[db].port was not uniquely found")
          config.write_text(source[:match.start(2)] + body + source[match.end(2):])
          print(f"Using isolated local Supabase DB host port {port}")
          PY
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply canonical migrations to disposable local database
        run: supabase db reset --local
      - name: D05 participant RLS pgTAP
        run: supabase test db supabase/tests/database/p7_d05_realtime_rls.test.sql
      - name: Reuse or pull pinned isolated PostgreSQL test image
        env:
          TEST_IMAGE: public.ecr.aws/supabase/postgres:17.11.0.006
          MIRROR_IMAGE: supabase/postgres:17.11.0.006
          IMAGE_DIGEST: sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        run: |
          cached_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$TEST_IMAGE" 2>/dev/null || true)"
          if grep -Fq "$IMAGE_DIGEST" <<<"$cached_digests"; then
            echo "Reusing the already available PostgreSQL test image at the pinned digest."
          else
            docker pull --platform linux/amd64 "docker.io/${MIRROR_IMAGE}@${IMAGE_DIGEST}"
            docker tag "$MIRROR_IMAGE" "$TEST_IMAGE"
            docker image inspect --format '{{json .RepoDigests}}' "$TEST_IMAGE" | grep -Fq "$IMAGE_DIGEST"
          fi
      - name: Offline activation contract tests
        run: python -m unittest discover -s supabase/tests/ops -p 'test_p7_activation_contract.py' -v
      - name: Driver availability and matching pgTAP
        run: python supabase/tests/ops/p7_a02_local_test.py
      - name: Driver offer acceptance concurrency
        run: python supabase/tests/ops/p7_a04_concurrency_test.py
      - name: Matching expiry pgTAP and concurrency races
        run: python supabase/tests/ops/p7_expiry_scheduler_local_test.py
      - name: Actual Cron worker activation, executions and disable
        run: python supabase/tests/ops/p7_expiry_cron_worker_local_test.py
      - name: Realtime publication activation and rollback guards
        run: python supabase/tests/ops/p7_realtime_publication_local_test.py
      - name: Stop only this workflow's disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
