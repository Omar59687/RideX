name: P8 Omar isolated cloud verification

on:
  push:
    branches:
      - ci/p8-omar-verification-20261119
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8-omar-verify
  cancel-in-progress: false

jobs:
  rider-payments:
    name: Rider payments focused, full Flutter, formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Display toolchain
        run: flutter --version
      - name: Resolve dependencies without modifying tracked files
        run: flutter pub get
      - name: Check owned Dart file formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/rider_payments \
            test/rider_checkout_controller_test.dart \
            test/rider_checkout_handoff_test.dart \
            test/rider_checkout_panel_test.dart \
            test/helpers/fake_rider_checkout_reader.dart \
            test/helpers/fake_rider_checkout_launcher.dart
      - name: Analyze Rider payment production files
        run: dart analyze lib/features/rider_payments
      - name: Analyze authored Rider payment tests
        run: |
          dart analyze test/rider_checkout_controller_test.dart
          dart analyze test/rider_checkout_handoff_test.dart
          dart analyze test/rider_checkout_panel_test.dart
          dart analyze test/helpers/fake_rider_checkout_reader.dart
          dart analyze test/helpers/fake_rider_checkout_launcher.dart
      - name: Run all 27 authored focused tests
        run: >-
          flutter test --no-pub --concurrency=1
          test/rider_checkout_controller_test.dart
          test/rider_checkout_handoff_test.dart
          test/rider_checkout_panel_test.dart
      - name: Full Flutter regression suite including Cash
        run: flutter test --no-pub --concurrency=1
      - name: Cash booking canonical Rider routing regression
        run: >-
          flutter test --no-pub --concurrency=1
          --dart-define=RIDEX_ENABLE_CASH_MATCHING_INTEGRATION=true
          test/canonical_rider_router_test.dart
      - name: Full analyzer (baseline non-gating diagnostics)
        continue-on-error: true
        run: flutter analyze --no-pub

  android-build:
    name: Default and guarded Cash-Driver Android APK compilation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build default-off Android debug APK
        run: |
          flutter build apk --debug --no-pub -t lib/main.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Build protected acceptance entrypoint without backend approval
        run: |
          flutter build apk --debug --no-pub \
            -t lib/main_acceptance.dart \
            --dart-define=RIDEX_ENABLE_CASH_MATCHING_INTEGRATION=true \
            --dart-define=RIDEX_ENABLE_TEST_DRIVER_CANONICAL=true \
            --dart-define=RIDEX_APPROVED_NONPRODUCTION=false \
            --dart-define=RIDEX_APPROVED_OFFER_COMMANDS=false
          test -s build/app/outputs/flutter-apk/app-debug.apk
